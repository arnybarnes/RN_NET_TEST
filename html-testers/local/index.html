<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Task API Tester</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f3efe6;
            --panel: #fffdf8;
            --panel-alt: #f9f3e7;
            --text: #1f1f1c;
            --muted: #6a655c;
            --border: #d7cdbd;
            --accent: #8f3b2e;
            --accent-strong: #6f281e;
            --ok: #1d6b43;
            --error: #912018;
            --shadow: 0 18px 40px rgba(58, 43, 23, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(143, 59, 46, 0.18), transparent 30%),
                linear-gradient(180deg, #f8f2e8 0%, var(--bg) 100%);
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        p {
            color: var(--muted);
            line-height: 1.5;
        }

        .hero {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .hero-card,
        .panel,
        .task-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }

        .hero-card {
            padding: 24px;
        }

        .hero-eyebrow {
            margin: 0;
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .hero-card h1 {
            margin: 8px 0 12px;
            font-size: clamp(2rem, 4vw, 3.2rem);
            line-height: 0.96;
        }

        .grid {
            display: grid;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .grid {
                grid-template-columns: 360px minmax(0, 1fr);
                align-items: start;
            }
        }

        .stack {
            display: grid;
            gap: 20px;
        }

        .panel {
            padding: 20px;
        }

        label {
            display: grid;
            gap: 8px;
            font-size: 0.95rem;
            color: var(--muted);
            margin-bottom: 14px;
        }

        input,
        textarea,
        select,
        button {
            font: inherit;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
            padding: 12px 14px;
            color: var(--text);
        }

        textarea {
            min-height: 96px;
            resize: vertical;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 10px 16px;
            cursor: pointer;
            background: var(--accent);
            color: #fff9f4;
            transition: transform 120ms ease, background 120ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            background: var(--accent-strong);
        }

        button.secondary {
            background: #e9decd;
            color: var(--text);
        }

        button.secondary:hover {
            background: #ddd0bb;
        }

        button.danger {
            background: var(--error);
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-line {
            margin-top: 14px;
            min-height: 1.5em;
            color: var(--muted);
        }

        .status-line.error {
            color: var(--error);
        }

        .status-line.success {
            color: var(--ok);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            background: var(--panel-alt);
            color: var(--muted);
        }

        .tasks {
            display: grid;
            gap: 16px;
        }

        .task-card {
            padding: 18px;
            background:
                linear-gradient(135deg, rgba(143, 59, 46, 0.06), transparent 32%),
                var(--panel);
        }

        .task-header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .task-title {
            margin: 0;
            font-size: 1.25rem;
        }

        .task-meta {
            display: grid;
            gap: 4px;
            margin: 12px 0 0;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .task-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .empty-state {
            padding: 32px 20px;
            border: 1px dashed var(--border);
            border-radius: 18px;
            text-align: center;
            color: var(--muted);
            background: rgba(255, 253, 248, 0.6);
        }

        pre {
            margin: 0;
            padding: 16px;
            overflow: auto;
            border-radius: 14px;
            background: #211b18;
            color: #f6e9d1;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 0.85rem;
            line-height: 1.45;
        }
    </style>
</head>
<body>
    <main>
        <section class="hero">
            <div class="hero-card">
                <p class="hero-eyebrow">Local API client</p>
                <h1>Task Tester</h1>
                <p>Use this page to exercise the local task API without Postman or Swagger. Point it at any base URL, create records, edit them inline, and inspect failures directly.</p>
            </div>
        </section>

        <section class="grid">
            <div class="stack">
                <section class="panel">
                    <h2>Connection</h2>
                    <label for="baseUrlInput">
                        API base URL
                        <input id="baseUrlInput" name="baseUrl" type="url" value="http://127.0.0.1:5024" placeholder="http://127.0.0.1:5024">
                    </label>
                    <div class="button-row">
                        <button id="loadTasksButton" type="button">Load tasks</button>
                        <button id="healthCheckButton" type="button" class="secondary">Health check</button>
                    </div>
                    <p id="globalStatus" class="status-line" aria-live="polite"></p>
                </section>

                <section class="panel">
                    <h2>Create Task</h2>
                    <form id="createTaskForm">
                        <label for="createTitleInput">
                            Title
                            <input id="createTitleInput" name="title" maxlength="200" required>
                        </label>
                        <label for="createDescriptionInput">
                            Description
                            <textarea id="createDescriptionInput" name="description" maxlength="1000"></textarea>
                        </label>
                        <div class="button-row">
                            <button type="submit">Create task</button>
                            <button type="reset" class="secondary">Reset</button>
                        </div>
                    </form>
                </section>
            </div>

            <div class="stack">
                <section class="panel">
                    <div class="toolbar">
                        <div>
                            <h2>Tasks</h2>
                            <span id="taskCount" class="pill">0 tasks</span>
                        </div>
                        <button id="refreshTasksButton" type="button" class="secondary">Refresh</button>
                    </div>
                    <div id="tasksContainer" class="tasks"></div>
                </section>

                <section class="panel">
                    <h2>Request / Response Log</h2>
                    <pre id="requestLog">No requests yet.</pre>
                </section>
            </div>
        </section>
    </main>

    <template id="taskTemplate">
        <article class="task-card">
            <div class="task-header">
                <div>
                    <h3 class="task-title" data-role="title"></h3>
                    <span class="pill" data-role="status"></span>
                </div>
                <span class="pill" data-role="id"></span>
            </div>

            <p data-role="description"></p>

            <form data-role="edit-form">
                <label>
                    Title
                    <input name="title" maxlength="200" required>
                </label>
                <label>
                    Description
                    <textarea name="description" maxlength="1000"></textarea>
                </label>
                <label>
                    Status
                    <select name="status">
                        <option value="Pending">Pending</option>
                        <option value="InProgress">InProgress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </label>
                <div class="task-actions">
                    <button type="submit">Update</button>
                    <button type="button" class="danger" data-role="delete-button">Delete</button>
                </div>
            </form>

            <div class="task-meta">
                <span data-role="created-at"></span>
                <span data-role="updated-at"></span>
            </div>
        </article>
    </template>

    <script src="./app.js"></script>
</body>
</html>
